<title>Healer 文案工作室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: left = product sheet (photos + notes), right = three route columns feeding one draft; training ledger below. */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#26242a; --muted:#6f6a73; --line:#e3e0e6; --soft:#efedf2;
  --accent:#6b4c7a; --accent-ink:#ffffff; --warn:#b23a48; --ok:#3f7a5a;
  --a:#b0577f; --b:#2f7486; --c:#6a7a2c;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1a1e; --panel:#24232a; --ink:#ebe8ef; --muted:#a39ea8; --line:#38353f; --soft:#2d2b33;
  --accent:#c3a2d3; --accent-ink:#1b1a1e; --warn:#ff8090; --ok:#7cc79c;
  --a:#e591b5; --b:#79c3d4; --c:#b9cb73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a1e; --panel:#24232a; --ink:#ebe8ef; --muted:#a39ea8; --line:#38353f; --soft:#2d2b33;
  --accent:#c3a2d3; --accent-ink:#1b1a1e; --warn:#ff8090; --ok:#7cc79c;
  --a:#e591b5; --b:#79c3d4; --c:#b9cb73; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--body)}
main{max-width:1440px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font:700 28px/1.2 var(--display);margin:0;letter-spacing:.02em}
h2{font:700 19px/1.3 var(--display);margin:0}
h3{font:700 16px/1.3 var(--body);margin:0}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.memory{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{color:var(--ink)}
.studio{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.studio{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label span.hint{font-size:12px}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:8px}
.drop.over{border-color:var(--accent);background:var(--soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:var(--soft);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:3px;top:2px;font-size:11px;background:var(--panel);color:var(--ink);border-radius:4px;padding:0 4px}
.thumb button{position:absolute;right:2px;top:2px;width:20px;height:20px;padding:0;border-radius:50%;font-size:12px;line-height:20px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:7px 14px;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
button.icon{background:transparent;color:var(--muted);border:0;padding:0 6px;font-size:15px;line-height:1.6}
button:disabled{opacity:.5;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--warn)}
.results{display:grid;gap:14px;min-width:0}
.banner{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:6px 10px}
.target{font-size:14px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.cols{grid-template-columns:1fr}}
.col{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;align-content:start;min-width:0;background:var(--panel)}
.col header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.col.A h3{color:var(--a)}.col.B h3{color:var(--b)}.col.C h3{color:var(--c)}
.line{display:flex;gap:4px;align-items:flex-start;padding:3px 4px;border-radius:6px}
.line:hover{background:var(--soft)}
.line .txt{flex:1;min-width:0;cursor:pointer;user-select:text}
.line.used .txt{color:var(--muted)}
.line .txt.br{color:var(--warn)}
.line mark{background:transparent;color:var(--warn);text-decoration:line-through;font-weight:700}
.heart{color:var(--muted)}.heart.on{color:var(--a)}
.colfoot{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.colfoot button{font-size:13px;padding:3px 10px}
details.det{font-size:13px;color:var(--muted)}
details.det ul{margin:4px 0;padding-left:18px}
.draft{border:2px solid var(--accent)}
.drow{display:flex;gap:4px;align-items:center}
.tag{flex:none;font-size:11px;font-weight:700;width:1.6em;text-align:center;border-radius:4px;color:var(--panel);background:var(--muted)}
.tag.A{background:var(--a)}.tag.B{background:var(--b)}.tag.C{background:var(--c)}
.drow input{flex:1}
.drow input.br{border-color:var(--warn)}
.mat{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.ledger{grid-template-columns:1fr}}
.ledger ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:280px;overflow:auto}
.ledger li{display:flex;gap:6px;align-items:flex-start;justify-content:space-between;font-size:14px;padding:3px 6px;border-radius:6px;background:var(--soft)}
.ledger li span{min-width:0;overflow-wrap:anywhere}
.empty{font-size:13px;color:var(--muted)}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar i{display:block}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ban-pop{position:fixed;z-index:20;font-size:13px;padding:5px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.line,.thumb{transition:background .15s}}
</style>

<main>
  <div class="top">
    <div>
      <h1>Healer 文案工作室</h1>
      <p class="lede">上傳商品照、補上材質與你的試穿感受，一次寫出三種版本。點句子組成自己的文案；按 ♡ 記下喜歡的句子，反白文字可以設成「不要再出現」。這些選擇和定稿會存成團隊的訓練紀錄，下一次寫作會照著調整。</p>
    </div>
    <div class="memory" id="memory" aria-live="polite"></div>
  </div>

  <div class="studio">
    <form class="panel" id="form" autocomplete="off">
      <h2>商品資料</h2>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="上傳商品照片">
        <div id="dropText">點這裡或把照片拖進來（全身照＋細節照最好）</div>
        <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <label>商品名稱<input type="text" id="name" placeholder="例：HEALER Made 無著感高腰彈性合身褲"></label>
      <div class="row2">
        <label>類別<select id="category"></select></label>
        <label>官方色名<input type="text" id="colors" placeholder="例：深藍、淺藍"></label>
      </div>
      <label>材質<input type="text" id="material" placeholder="例：✦材質成份：棉68%+聚酯纖維27%+彈性纖維5%"></label>
      <label>背景資訊<span class="hint">補貨、改版、自訂款、熱銷、搭配建議……寫了才會用</span><textarea id="background" placeholder="例：去年賣到缺貨，今年加了新色；腰頭改成全鬆緊"></textarea></label>
      <label>自身感受<span class="hint">試穿心得、身高尺寸、觸感，會直接寫進文案</span><textarea id="feeling" placeholder="例：162 公分穿 S，長度剛好到腳踝；布料軟，坐下不會勒"></textarea></label>
      <div class="tools">
        <button type="submit" id="go">寫三種版本</button>
        <button type="button" class="ghost" id="stop" hidden>停止</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </form>

    <section class="results" aria-label="寫作結果">
      <div class="banner" id="banner"></div>
      <div class="target" id="target"></div>
      <div class="cols" id="cols"></div>
      <details class="det" id="details"></details>
      <div class="panel draft">
        <h2>我的文案</h2>
        <div id="draftRows" style="display:grid;gap:4px"></div>
        <div class="mat" id="draftMat"></div>
        <div class="status" id="draftStats"></div>
        <div class="tools">
          <button type="button" id="copy">複製文案</button>
          <button type="button" class="ghost" id="saveFinal">存成定稿</button>
          <button type="button" class="ghost" id="blank">＋ 空白行</button>
          <button type="button" class="ghost" id="clear">清空</button>
          <span class="status" id="draftMsg"></span>
        </div>
      </div>
    </section>
  </div>

  <section class="panel" aria-label="訓練紀錄">
    <div class="top">
      <div>
        <h2>訓練紀錄</h2>
        <p class="lede">每次寫作都會帶入下面的內容。建議先累積 10 篇定稿，再看三種版本有沒有越來越接近你們的口氣。這是把紀錄放進提示裡，不是重新訓練模型；刪掉一筆，下一次就不再參考。</p>
      </div>
      <div style="display:grid;gap:4px;min-width:min(260px,100%)">
        <div class="legend" id="routeLegend"></div>
        <div class="bar" id="routeBar"></div>
      </div>
    </div>
    <div class="ledger">
      <div style="display:grid;gap:8px;align-content:start">
        <h3>不要再出現</h3>
        <div class="inline"><input type="text" id="banInput" placeholder="直接輸入字詞，例：水水看過來"><button type="button" class="ghost" id="banAdd">加入</button></div>
        <ul id="banList"></ul>
      </div>
      <div style="display:grid;gap:8px;align-content:start">
        <h3>喜歡的句子</h3>
        <ul id="likeList"></ul>
      </div>
      <div style="display:grid;gap:8px;align-content:start">
        <h3>定稿</h3>
        <ul id="finalList"></ul>
      </div>
    </div>
    <div class="status" id="dbStatus"></div>
  </section>
</main>
<button type="button" class="ban-pop" id="banPop" hidden></button>

n長度不紮就有大長腿又可以蓋到肚子\n非常完美的版型"}, {"id": "2602040004", "name": "HEALER Made 完美藏肉 兩件式天絲扭結針織罩衫", "category": "長袖", "material": "材質：100%天絲萊賽爾", "description": "有看過闆娘影片應該就知道這個兩件式非常厲害\n其實單穿背心也不會很合身\n是很多罩衫的搭配小幫手\n但是扭結罩衫太好看\n搭上去變得有點時髦又小性感\n資深股東看到直播馬上跟我說他要+1\n這款的針織完全親膚 100%g天絲所以超級舒服\n扭結罩衫也可以拿來搭配其他背心洋裝\n感覺怎麼搭都好好看"}, {"id": "2602240001", "name": "HEALER Made 神仙西外 清透涼感西裝外套", "category": "外套", "material": "✦材質成分：57%嫘縈+23%天絲+20%尼龍", "description": "挑戰最薄西外！也是最仙西外！\n直播一穿出來大家都驚呼也太漂亮～～\n這款布料含有天絲所以透氣舒適\n在台灣盛夏或南部穿都不會太熱\n布料有一點光澤 穿起來自帶仙氣\n沒有墊肩而且長度蓋臀 穿起來超級顯瘦\n奶白仙到爆 灰藍更日常一點\n搭配牛褲或是傘裙都很氣質漂亮！"}, {"id": "2602240009", "name": "HEALER Made 升級版吊帶魚尾洋", "category": "洋裝", "material": "✦材質成分：100%聚酯纖維", "description": "各位觀眾！超強無敵升級版的魚尾洋來了\n這次是委託歐膩找布製作\n所以單價比之前高但是質感也比之前再好一些\n換了一塊布 一樣是顯瘦耐洗彈性好的皺皺布\n這次的坑條更不規則更立體\n布料比之前再更挺一些\n顏色光澤完全不一樣(所以黑色也不太一樣)\n只有一個長度 肩帶可調\n從150公分穿到170公分都沒問題\n還沒收過魚尾洋或者超愛穿魚尾洋的水水\n強烈建議包色購入！！"}, {"id": "2603020002", "name": "HEALER Made 貫穿春夏 細條紋細肩帶背心", "category": "背心", "material": "✦材質成份：95%棉+5%彈性纖維", "description": "春夏超好搭配的小背心\n坑條料穿起來就是瘦瘦瘦！(史上最心機布料)\n我們特別設計前後兩穿 一面比較平領 適合氣質搭配;一面比較Ｕ領小小性感又修臉型\n值得注意的是兩面都不會太低胸 是彎下腰不會曝光的程度\n這個細條配色我們真的選得很好\n搭起來比一般素色背心更有戲\n顏色也都好可愛好想包色(尖叫)\n紅跟深灰我們特別準備了同布料小外套可搭 成set喔～\n不露手臂的防曬好夥伴當然要一起帶上乘之作 細條紋長袖小外套"}, {"id": "2603020003", "name": "HEALER Made 純慾系 細肩帶蕾絲背心", "category": "背心", "material": "材質成份：100%棉", "description": "。肩帶可以調整 。可以內搭T恤穿 。75E穿完全沒問題\n簡單精緻的蕾絲設計\n這個布料真的好漂亮~~\n細看有令人讚嘆的質感\n我們選用透氣親膚的棉料,夏天穿非常適合!\n肩帶可以調整!胸部豐滿的水水穿也沒問題\n領型平口可以單穿,也可以內搭T恤穿\n平時或度假搭配都很適合!!!\n天吶~~必須要收\n蘋果編75E穿完全沒問題!還有空間唷"}, {"id": "2603020014", "name": "HEALER Made 半夏雨 彈性削肩背心", "category": "背心", "material": "✦材質成份：46%棉+46%嫘縈+8%彈性纖維", "description": "我們自訂的削肩背心版型一定比東大門的都完美！\n不會太削肩太設計感又可以藏副乳\n隨便搭個下身都是簡單涼爽漂亮✨\n我們這次也有找一款選品的罩衫\n#舒適區 大V領薄針織罩衫來遮手臂用\n兩個搭在一起根本天生一對\n我真的很想私藏兩色ＸＤ"}, {"id": "2603160001", "name": "HEALER Made 花間集敘 花邊針織背心", "category": "背心", "material": "材質成份：100%縲縈", "description": "忍不住大呼超可愛！的花邊針織\n我們自訂的漂亮版型\n穿起來感覺合身卻不貼身( 肉痕都藏起來)\n質料超親膚 有一點厚度整體看起來更有質感\n側邊邊較低需內搭BRATOP\n下面可開扣穿 看起來腿會比較長喔～\n搭大長腿褲就很好看\nPs.內搭短Ｔ穿也好驚豔！！"}, {"id": "2604080007", "name": "HEALER Made 新色加長水感裙 後開衩修胯直筒裙", "category": "裙子", "material": "✦材質成分：64%嫘縈+28%尼龍+8%彈性纖維", "description": "水感裙穿過回不去！\n光是去年就賣了快1000件\n客人都回饋不只又涼又舒服\n還非常修飾肚子屁股！！\n一般薄料棉裙很難做到同時很修飾\n只有水感裙能做到\n厲害的是這次我們做了加長版\n穿起來腿會更長且更時髦\n也是高個水水福音\n新色都好美 補貨必須趁現在"}, {"id": "2604080010", "name": "HEALER Made 薄片短洋 翻領開襟綁帶短洋裝", "category": "洋裝", "material": "✦材質成分：70%嫘縈+30%聚酯纖維", "description": "這次最受矚目的洋裝！\n這個看起來每天都可以穿啊啊啊！～\n厲害的是版型非常藏肉修飾\n沒腰變有腰 胯寬也通通藏起來\n我最愛的是腰帶鈕釦設計\n比蝴蝶結更有設計感\n領子袖子寬度都很恰好 穿起來上身顯瘦\n加上高質感布料 收到都會很滿意\n這款讓產後還肉肉的闆娘側面變薄片！？\n真的是沒買到會憾恨的厲害短洋\np.s. 奶白單穿會微透建議直接跟神隊友回歸 細肩帶BRATOP內襯洋一起購入或一定要穿bratop+安全褲喔！"}, {"id": "2604080011", "name": "HEALER Made 神隊友回歸 細肩帶BRATOP內襯洋裝", "category": "貼身內著", "material": "✦材質成分：100%聚酯纖維", "description": "今年因應奶白薄片短洋推出的內襯洋\n每年都會默默賣光光的款式\n完全是夏季白色系服搭的神隊友\n每個人衣櫃都必須有一件！\n我們選用杏色穿起來比白色更隱形\n材質彈性好 高質感 肩帶可調\n重點是還內建縫死的bra\n臺灣夏天穿也很友善\n堪稱最貼心的一件內襯洋"}, {"id": "2604080026", "name": "歐膩開外掛 蕾絲柔棉休閒寬褲", "category": "長褲", "material": "✦材質成分：96%棉+4%彈性", "description": "跟 首爾日常 蕾絲柔棉連帽外套搭一整套超級好看\n內側接觸肌膚的面料不是那種粗硬的毛巾布\n柔棉感真的很舒服！\n寬褲的版型穿上真的是腿長有開外掛\nAlice身高157cm有直接把褲長改短也不影響版型\n褲管不收邊改起來也容易\n一樣有蕾絲抽繩\n大腿處側邊有精緻的小字母刺繡\n精緻度大大提升"}, {"id": "2604080029", "name": "曲線製造 涼感薄料靴型牛仔褲 S-L", "category": "長褲", "material": "✦材質成分：100%棉", "description": "涼感薄料的牛仔布真的是夏天必收\n這件褲型在腿部線條的修飾效果也很棒！\n版型不像一般的微喇褲只有在褲管尾巴做擴型\n大腿部分也不是超緊身窄版\n褲型剪裁讓腿整個很延伸\n刷色是偏復古仿舊的水洗色\n搭休閒或氣質的上衣都百搭💯"}, {"id": "2604080032", "name": "白日夢 垂墜斜波浪短裙", "category": "裙子", "material": "✦材質成分：100%尼龍", "description": "這兩年韓國好流行荷葉小短裙\n感覺是張員瑛會穿的衣服 😆\n走一個甜又不會太超過的風格\n這件側邊有隱形拉鍊穿脫方便\n垂墜的荷葉裙襬不顯臀也有修飾比例的效果✨\n很適合和Alice身高差不多的小個女孩喔！"}, {"id": "2604130002", "name": "HEALER Made 空姐短裙 輕磨毛A字短褲裙", "category": "裙子", "material": "✦材質成份：主布：63%聚酯纖維+32%嫘縈纖維+5%彈性纖維 裡布：100%聚酯纖維", "description": "一穿就被說像空姐ＸＤ\n真的是非常強大的版型！！\n突然覺得我們很會做短褲裙\n這款微Ａ字 不會太寬鬆也不會太貼臀\n藏肉的恰到好處\n材質選用舒服的毛料 內裡是褲子\n後鬆緊所以穿起來舒適度極佳\n長度適中微偏大(S號最大穿到腰圍30吋臀圍37吋左右)\n大家買之前再參考一下試穿報告"}, {"id": "2604300028", "name": "雲上漫步 拼接輕量透氣球鞋", "category": "鞋子", "material": "✦材質成份：", "description": "拍照跟直播搭配就曝光過的球鞋\n陸續有人詢問 加上我們也試穿了一輪\n鞋墊很舒服 有支撐的回彈感\n表布是像機能布的尼龍材質\n透氣度也不錯\n主打一個夏天穿了腳也能呼吸的球鞋\n後腳跟有做鬆緊設計 就像芭蕾舞鞋那種設計\n整雙球鞋的重量超級輕(尺寸24的重量才382g)\n帶出國做替換也不占多少重量 超級輕便！\n扁形的楦頭 穿感是比較有包覆性的那種\n比較貼合腳板是正常的喔 可以帶大半號加襪子穿更舒適～\n鞋帶尾巴有做皮革收尾處理\n小細節蠻可愛的！"}, {"id": "2605140018", "name": "法式氛圍 澎袖開襟短袖長洋裝", "category": "洋裝", "material": "✦材質成份：79%棉+21%聚酯", "description": "可以當洋裝或是釦子全開當長版罩衫\n兩種穿搭都非常好看！\n買這件有種賺到的感覺😆\n因為裡面有內裏\n當洋裝穿也不用擔心會透\n腰綁帶可以綁前製造腰身\n想往後綁也很氣質\n圓弧領口處做了點小抓褶\n然後落肩的版型順下來\n寬肩人也友善！\n小澎袖增加了甜美感\n珊編試穿時袖口的釦子不能扣喔！手臂處會太合\n其他部分都沒問題\n大家可以參考試穿報告圖的手臂圍喔\n長度我也很喜歡\n兩色都很有仙感💗"}, {"id": "2605140020", "name": "輕氧感 側釦薄料針織外套", "category": "外套", "material": "✦材質成份：85%嫘縈+51%聚酯", "description": "很可以包色的薄針織外套！\n整體不會很貼合\n面料也帶點彈性\n隨手放包包裡或當披肩都好看又輕便\n另外在側邊多縫了一顆釦子\n可以故意釦側邊\n會有一個交叉腰身的設計\n是一件可日常又可以很有造型的外套～"}, {"id": "2606090005", "name": "HEALER Made 水感裙新色回歸!! 後開衩直筒裙", "category": "裙子", "material": "✦材質成份：62%嫘縈+30%尼龍+8%彈性纖維", "description": "今年水感裙是春夏熱賣王 一推出就賣了500多件🔥🛒\n重點是很多人買了之後很喜歡又一直回來問還買得到嗎🥺\n因此我們破天荒在同一季以新色回歸了!!\n還準備包色價要給妳們一網打盡🤣\n這次的新色都好好看 根本也是包色級\n墨色顯瘦沒話說 奶茶色就是大地人的首選Pick呀\n身高147的小小編也可以穿\n跟水感褲完全一樣的超涼超舒服布料❄️\n彈性也非常好 寬鬆緊帶不會向外翻\n有綁帶小腰穿也不會太鬆\n有口袋但穿起來不顯胯😎\n口袋的位置還有視覺縮臀的效果超讚"}, {"id": "2606120005", "name": "HEALER Made 藍莓雪糕 V領涼感細坑條上衣", "category": "短袖", "material": "✦材質成分：95%酷絲棉+5%彈性纖維", "description": "這件上衣質料也是那種一穿驚艷的涼感料\n而且超級無敵非常不易皺！\n超級無敵不容易起毛球\n總之就是很好顧的材質\n上衣我們做最顯瘦的Ｖ領\n袖子雖然是小包袖但袖長不會太短\n還是可以遮到蝴蝶袖\n很喜歡這款下擺鬆緊的設計\n搭一些鬆緊褲頭的下身不用紮就很好看\n我們有做成套的直裙給大家搭成套裝"}, {"id": "2606120006", "name": "HEALER Made 藍莓雪糕 涼感細坑條長裙", "category": "裙子", "material": "✦材質成分：95%酷絲棉+5%彈性纖維", "description": "這件裙真心讓人愛不釋手\n版型不貼肚 不貼臀\n材質是非常不易皺的舒服涼感料\n而且非常不容易起毛球那種\n坑條的紋路也很重要 穿起來更顯瘦\n裡面有做內裡不會透光\n整體穿起來舒適又修身\n裙長並沒有做得很長\n完全小隻女友善"}, {"id": "2606120022", "name": "HEALER Made 幸福二重奏 船領兩件式針織毛衣", "category": "針織毛衣", "material": "✦材質成份：50.7%嫘縈+28.6%聚酯+20.7%尼龍", "description": "跟上流行的兩件式針織\n也太難選色了吧(哭)\n紅色超適合過年穿！感覺會刮中大獎\n黑色穿起來又很俐落顯瘦\n這款材質親膚 敏感肌可穿\n版型寬鬆彈性好 所有身形都可穿\n船領外罩有很多穿法：不露肩/斜肩/一字露肩\n兩件拿去疊搭別人都超級好看！！！\n闆娘外罩還有疊穿洋裝真的太驚艷\n推薦本次必買"}, {"id": "2607020003", "name": "HEALER Made 神級配色 條紋開襟短袖薄針織衫", "category": "短袖", "material": "✦材質成分：60%聚酯纖維+40%嫘縈", "description": "所有人都必須包色的針織衫\n只能說我們配色配得太絕妙\n兩色穿起來是截然不同的風格\n呼聲很高的清爽黃色是夏季活潑感\n黑粉則是高級知性首選\n兩種感覺我都想要有！！\n而且料子也非常輕薄舒服\n完全不會刺或粗粗的！極敏感肌也友善\n衣長穿上是大長腿\n整件不會貼手臂或軀幹\n除了闆娘我自己要包色之外也要幫婆婆包色\n(婆婆大呼好漂亮！！：Ｄ)"}, {"id": "2607020005", "name": "HEALER Made 微醺女神洋 一字領側綁帶無袖洋裝", "category": "洋裝", "material": "✦材質成分：85%嫘縈+15%尼龍", "description": "完全就是闆娘我每天上班或外出會想穿的洋裝\n一件無腦出門而且又涼又修身\n又不易皺！！！\n超愛這個一字領 穿上就是漂亮歐膩\n氣質無人能敵\n下身是裙片自己綁腰 可以綁鬆也可以綁緊\n身型可以從S號穿到珊編\n大家都可以駕馭的尺寸\n這種洋裝日常或節慶都可以穿\n甚至有客人說想要慶生穿\n我都可以想像那個照片有多美\n白色有內裡不太會透但還是不要穿深色內衣褲喔\n是可以穿好幾年的女神洋裝\n大推包色購入！！"}, {"id": "2607020012", "name": "形上學 細壓皺捲邊開襟上衣", "category": "短袖", "material": "✦材質成分：100%聚酯", "description": "一穿上這件上衣第一個感覺是好瘦！\n叫了那麼多款壓褶上衣 這款是最厲害的\n而且材質柔軟親膚\n彈性也非常好\n排扣的設計除了當上衣外也可以打開當外套\n捲邊細節增添可愛感\n是一件很值得入手的高級感上衣"}, {"id": "2607020015", "name": "強者罩衫 拉鍊連帽輕薄針織外套", "category": "外套", "material": "✦材質成分：54％嫘縈+23％聚酯+15％亞麻+8%棉", "description": "一看就是日常超好搭 全能的罩衫外套\n首先料子非常薄 台灣防曬很適合\n衣長夠長可以蓋一些屁股\n還有最最厲害的連帽\n整件穿起來的慵懶休閒感很讚\n而且風格可休閒可正式\n這款的白色有點偏杏灰色\n讓他變得超好搭\n藍色也好美～～～"}, {"id": "2607020022", "name": "經典韓感 直筒白色牛仔長裙 S/M", "category": "裙子", "material": "✦材質成分：100%棉", "description": "誰的衣櫃裡還沒有一件白色牛長裙～\n絕對是各種上衣風格\n怎麼配都不會出錯的白長裙\n順身剪裁不會讓下身有臃腫感\n後開衩設計\n整件簡約經典又很亮眼👀✨"}, {"id": "2607020024", "name": "無印漫日 Ｕ領棉質背心長洋裝", "category": "洋裝", "material": "✦材質成分：94%棉+6%彈性纖維", "description": "背心肩帶的寬度是可以正常穿內衣\n不想露手臂的話\n可以搭個罩衫\n很喜歡這件的版型不是普遍常見合身的\n下襬稍微做A字傘裙\n臀部位置不貼合 也有腰身曲線\n簡單好看又顯瘦\n揹個草編包直接可以去海邊耍美~"}, {"id": "2607020029", "name": "再度被敲碗！ 空頂簍空草編遮陽帽", "category": "帽子", "material": "✦材質成分：65%棉+35%紙", "description": "去年闆娘在動物園的穿搭被狂問這頂\n今年她去竹圍沙灘戴了這頂\n也是隔三差五就會收到私訊問今年還有沒有賣\n我們問了廠商今年還有出！\n一樣可以調整頭圍 頭型友善\n去年裡面繩子是直接綁的有時候會露出來\n今年的調節繩子末端有設計魔鬼氈\n調整到適合的頭圍後可以黏好藏起來\n小小細節的升級這頂又更完美了！\n超級大帽簷很遮陽 非常推薦綁公主頭～\n也嘗試過丸子頭 高馬尾都很美\n拍照很有氛圍感 還能修飾讓臉小小🥰"}, {"id": "2607150001", "name": "螢火織夢 細帶厚底夾腳涼鞋", "category": "鞋子", "material": "✦材質成份：100%合成皮", "description": "小隻女孩很推薦這雙涼鞋\n做厚底的設計就可以穿長度偏長的下身\n也有拉長腿部線條的效果👍\n是一款穿起來很舒適的涼鞋\n輕鬆就可以馬上出門\n是好穿的夾腳可以走很久🥰～"}, {"id": "2607240016", "name": "HEALER Made 微雨 細點緹織透膚襯衫", "category": "襯衫", "material": "✦材質成分：100%聚酯纖維", "description": "超級美的韓國布料\n不規則的直紋跟輕透感之前從未見過\n這款也是委託歐膩做的\n版型100%完美\n穿起來可率性可浪漫\n版型寬鬆但又有修飾身型的效果\n不會太大件也不會太長\n即使搭配長洋 腿的比例也很好\n這次還破天荒出了彩度比較高的粉橘色\n穿起來氣色超好 很適合渡假"}, {"id": "2607240017", "name": "HEALER Made 珊瑚灣 細肩抓褶美背綁帶蛋糕洋裝", "category": "洋裝", "material": "✦材質成分：100%聚酯纖維", "description": "這件真心大推要收！\n一秒轉換渡假的心情\n闆娘帶去淡水拍照莫名也覺得渡假了一下午(XD\n真的超級神奇\n背面是女神重點\n簍空而且綁起來帶子長長的蝴蝶結\n既有設計感又浪漫\n我們自訂款版型很肉肉友善\nXL的珊編也可以穿\n正常Ｓ號穿的話會覺得後面腰頭偏鬆\n但不會曝光\n長度是高個子或肉肉友善\n長度夠長所以度假感很足\n韓國的布料也非常漂亮"}, {"id": "2607240018", "name": "HEALER Made 新色風和日暖 雪紡短袖長洋", "category": "洋裝", "material": "✦材質成分：內：100%棉 外：100%聚酯纖維", "description": "風和日暖今年夏天已經出過一版\n但還是有非常多客人敲碗新色\n這次的淡粉雖然之前有出過一次\n但還是很多人想要 已是最美的粉色\n深藍則是全新的顏色\n非常低調有質感的深藍\n新同學還不認識風和日暖我來介紹\n已經出了好幾年的進店必買款\n身形很友善 肉肉妞跟孕婦都可穿\n小隻女版的長度是我們獨家訂製\n闆娘我自己就有自留四個顏色\n每次只要穿出門就會沿路被看\n還曾經一天被鄰居誇,燒到花店闆娘,被小張董稱讚\n真的不只是懶人洋裝\n還是超美超仙的懶人洋裝\n一輩子至少要擁有兩色！"}, {"id": "2607240021", "name": "HEALER Made 天藍假期 細直紋軟料側剪接牛仔寬褲", "category": "長褲", "material": "✦材質成分：80%棉+20%聚酯纖維", "description": "超級好看的淺藍色丹寧！！\n闆娘穿去獨旅也有很多客人詢問\n這款近看布料是淺淺直紋\n非常漂亮有質感\n直紋也有顯瘦修長的效果\n版型跟大長腿褲一樣穿起來都很修身\n不管是蘋果型還是梨型穿都很友善\n這款布料是薄棉料\n夏天穿透氣涼爽\n沒買到大長腿褲淺藍色完全可以考慮這款"}, {"id": "2607240024", "name": "修長罩衫 捲邊細坑條薄軟小外套", "category": "長袖", "material": "✦材質成分：50％聚酯纖維+50％嫘縈", "description": "乍看以為就是一件質料很舒服的小外套\n但穿起來非常非常顯瘦\n坑條直紋跟版型做得真的很優秀\n袖子跟軀幹都不會合身\n長度也不會露肚子\n布料薄薄軟軟很適合夏天穿\n袖口跟下擺的捲邊增添可愛感\n買回去不會後悔的一款"}, {"id": "2607240026", "name": "向陽 緹花透肌短袖開襟上衣", "category": "短袖", "material": "✦材質成分：100%聚酯", "description": "今年也出了好多漂亮的緹花布\n這款是大朵花花x直紋的透肌布料\n很有眼前一亮的感覺\n布料有一點粗粗的但不會刺癢\n短袖單穿或當罩衫都很涼\n衣長不用紮 除了牛褲之外\n即使搭傘裙比例也很漂亮"}, {"id": "2607240027", "name": "baby girl 蕾絲肩帶側綁傘擺背心", "category": "背心", "material": "✦材質成分：100％棉", "description": "方領蕾絲非常可愛\n這款傘狀不會太傘\n長度又可以遮肉肉\n下身搭配合身的褲子也會非常好看\n很喜歡它側邊綁帶的設計\n有點baby感 很有巧思\n純棉透氣又舒服"}, {"id": "2607240028", "name": "藏一點驚喜 蕾絲下襬側釦造型背心", "category": "背心", "material": "✦材質成分：100%棉", "description": "本來覺得背心中線設計\n棉料材質和版型好像有點中性\n但有了下襬蕾絲整個可愛度大提升\n側腰有設計一顆小釦子\n扣起來會有個收腰抓褶的效果\n超喜歡這種設計感很有小巧思\n不過釦起來會比較適合S號的女生\n不然行動時會有點小緊繃感~\n可以不要釦直接當背心就很好看👍"}, {"id": "2607240037", "name": "逛逛花店 細肩帶抓褶傘襬長洋裝", "category": "洋裝", "material": "✦材質成分：68%聚酯+32%尼龍", "description": "穿上直接有溫柔又有氣質的感覺\n胸前做直向壓褶\n讓上半身看起來比較瘦、比例也更好\n腰跟臀都有留空間\n小腹、大腿、屁股藏起來\n裙襬的挺度很剛好 不會有膨脹感✨\n裡面搭T恤就很日常可愛\n單穿又是不同感覺\n一件可以穿出兩種風格 很值得收🤎🤍"}, {"id": "2607240039", "name": "人魚眼淚 閃鑽漁網瑪莉珍鞋", "category": "鞋子", "material": "✦材質成分：合成皮", "description": "這陣子鏤空魚網鞋太紅了！！！\n雖然我們比別人晚一些才上架\n但這雙我們真的很滿意！\n像這類型的鞋子很怕材質不好會咬腳\n但它整個鏤空編織的地方都不會刺\n包邊也很舒服還帶點彈性\n細鑽不只漂亮\n重點是也不會刮腳\n抓地力也夠不是整個平底的\n所以多走一點路也不會腳痠腳痛💯💯💯"}, {"id": "2608130022", "name": "夢中情靴！麂皮小金標長靴", "category": "鞋子", "material": "✦材質成份：100%合成皮", "description": "如果是買靴子常常擔心會卡小腿圍的\n那這雙絕對是妳的夢中情靴\n非常難得的小腿肌友善\n也沒有拉鍊 直接ㄌㄨㄥ進去就好了\n有夠方便！穿起來也超舒適\n小腿比較細的水水也不用擔心\n這雙穿起來很挺！逸歡跟逸玲兩姊妹都火速搶著自留😼\n塞合身牛仔褲也好看\n今年真的很流行不要再錯過囉 妳們一定會需要這個單品～～～"}, {"id": "2608180006", "name": "HEALER Made Le Croissant 可頌文字針織衫", "category": "長袖", "material": "✦材質成份：60%壓克力纖維+40%尼龍", "description": "好喜歡這款法式英文針織\n字體跟配色很有療癒感\n版型合身不貼身 蝴蝶袖跟腰間肉不會現形\n衣長也很剛好 可以不用紮衣服就有好比例\n材質親膚不刺 厚度適中\n不會太厚 不管今年是暖冬還是寒冬都能穿到ＸＤ\n是一款更可愛的基本毛衣\n冬季搭任何外套或背心都很漂亮"}, {"id": "2609010020", "name": "HEALER Made品牌法蘭絨兩用毛毯", "category": "品牌週邊", "material": "材質成分：100％聚酯纖維", "description": "去年大獲好評的滿額贈品 是秋冬的居家辦公好朋友！\n舒服柔軟的毛毯很保暖\n除了可以收納成方形的靠枕\n還有扣子讓你可以解放雙手 自由做事~"}, {"id": "2609010022", "name": "HEALER Made 得意之作2.0 連帽絎縫鋪棉外套", "category": "外套", "material": "✦材質成份：100%聚酯", "description": "熱賣超過千件的得意之作升級版\n袖口取消抽繩改為彈性縮口\n口袋改為不對稱口袋設計 整體版型小一點\n質感兼具實用的連帽鋪棉外套 布料有防風效果\n推薦機車族一定要購入呀 重量超級輕方便攜帶\n擁有超多收納口袋～\n微立領的感覺看起來更俐落\n我們這次去首爾遇到下雨 完全不擔心 因為...\n後領拉鍊打開後～有帽子設計！！！\n非常適合拿來遮風擋雨\n長度也剛好，不管是搭配褲裝、裙裝都很修飾~\n今年的2.0版我們真心推薦"}, {"id": "2609010023", "name": "HEALER Made 初雪國度 輕盈鋪棉背心", "category": "外套", "material": "✦材質成份：主布：100%尼龍 裡布：100%聚酯纖維100% 填充物：100%棉", "description": "台灣的天氣忽冷忽熱\n鋪棉背心真的是偉大的發明\n有一定的保暖度又不會被涼到\n不會太膨的鋪棉穿起來非常顯瘦\n肩寬也幫大家調得很剛好 窄肩 寬肩穿都好看\n裡面要搭洋裝或是自訂的 #超Q彈微高領T 都好看\n我們選了兩個好好搭的顏色\n雀編在韓國街拍的灰棕色真是燒得我咪咪帽帽\n有夠特別不容易跟別人撞色的\n而且有口袋！！！ 輕巧與實用都幫妳想好了"}, {"id": "2609010030", "name": "HEALER Made 慵懶時光 寬條紋羊毛針織外套", "category": "外套", "material": "材質成份：50%聚酯纖維+40%尼龍+10%羊毛", "description": "很可愛的針織外套\n秋冬兩個季節都可以穿\n想單穿當上衣的話裡面搭BraTop就ok\n要當外套也可以配素T\n這兩色也是很好抉擇的哈哈\n想日常都能搭配就選棕色\n想在年末來個可愛繽紛就選紫色\n紫色穿起來真的很提氣色\n衣服長度也是下身腿會很長的那種 讚讚～"}, {"id": "2609010033", "name": "冬日小棉被 雙排釦連帽鋪棉長版外套", "category": "外套", "material": "材質成份：61％棉+39％尼龍", "description": "雖然是鋪棉,但保暖度也是非常夠!\n連帽長版很擋風\n雙排釦設計 穿起來像是鋪棉的風衣\n還有額外附綁帶可以全身包緊緊\n如果去日本韓國比較冷的國家 可以考慮帶這件!\n147cm的小小編也可以穿唷!"}, {"id": "2609010038", "name": "夏日棉花糖 一字領小澎袖上衣", "category": "短袖", "material": "材質：61％聚酯+30％棉+9％彈性", "description": "這件好可愛!可以兩穿的上衣\n看起來很露但其實穿起來很顯瘦\n拉一字領露出鎖骨看起來上身更纖細\n不拉一字領可以日常穿\n可愛又迷人~\n材質是超舒服綿,且領口和下擺是鬆緊帶設計\n不會很勒!鬆緊帶超彈力!\n穿起來很舒服唷"}, {"id": "2609010039", "name": "藏在雪糕裡 蕾絲繡花短洋裝", "category": "洋裝", "material": "材質成份：100%棉", "description": "這款是短版的繡花蛋糕短洋裝\n肩帶是可以調節長度的\n所以各種身高的女生都沒問題哦！\n蛋糕裙擺也很修飾下半身\n3個顏色都超級可愛\n如果已經有很多白色洋裝了\n可以考慮看看這次的藍 or 米黃色\n害怕露手臂就搭配本期的薄針織外套\n很有度假感的可愛短洋～"}, {"id": "2609010054", "name": "HEALER Made 輕巴恩風 輕磨毛翻領夾克外套", "category": "外套", "material": "✦材質成份：主布：63%聚酯纖維+32%嫘縈纖維+5%彈性纖維\n裡布：100%聚酯纖維", "description": "👉跟空姐短裙 輕磨毛A字短褲裙 成套搭配超好看❤️\n這款有一點微巴恩的感覺但非常非常好駕馭\n首先是料子我們選用觸感很好的毛料\n摸起來很有療癒感 還有做精緻的內裡\n版型沒有做得太寬大 小隻女穿也可以\n整體的感覺有一點率性但還是很女生\n我們另外做了版型很完美的短褲裙讓大家無腦搭一套\n過年裡面穿紅紅然後外罩大衣會非常時髦漂亮"}, {"id": "2609010059", "name": "冬日格調 輕磨毛格紋襯衫", "category": "襯衫", "material": "✦材質成份：60%聚酯+40%棉", "description": "這件就是秋冬氛圍製造機\n很舒服的輕磨毛\n要當外套或直接單穿\n還可以外罩毛衣或背心\n也能在裡面疊搭素T !!!\n可以做的搭配非常多樣😍\n紅色蠻特別的很有亮點\n秋冬的造型搭配需要來一件～"}, {"id": "2609010094", "name": "HEALER Made 完美小姐 柔棉小包袖襯衫", "category": "襯衫", "material": "材質成份： 100%棉", "description": "已被瘋狂敲碗好幾年不得不回歸\n南部客人大讚這個材質透氣又很涼\n版型很顯瘦！！！\n白跟藍是之前的熱賣色再度回歸 ★粉跟黃是新色\n這次不買不知道又要等幾年 建議包色囤好囤滿\n#完美版型\n修飾身形、肩線\n不限身形都可著用 寬肩、大胸也可以(大推)\n#高質感質料\n舒適柔棉 親膚透氣\n微透布料 適合夏天的沁涼感\n#小包袖設計\n肉肉手臂友善\n袖子微挺?整體精神有朝氣\n不管是休閒或上班日常穿搭 都很好做搭配"}, {"id": "2609010097", "name": "HEALER Made 副乳隱藏術2.0 洞洞針織削肩背心", "category": "背心", "material": "材質成份：89%嫘縈+11%尼", "description": "去年的熱賣秒殺款除了幸福布拉塔還有這款!!\n請搭配我們幸福布拉塔平口bratop一起購買\n穿削肩免煩惱~~\n我們的削肩背心穿起來都有顯瘦感 非常厲害！\n去年是做格紋的針織設計\n今年改版織紋是可愛的洞洞\n版型跟去年一樣 都非常藏副乳\n白色和黑色最百搭 橘紅真的很顯白(所有膚色都可駕馭)\n長度也是可以不用紮的唷～\n不喜歡露出手臂的水水可以搭針織外套\n微微露肩膀線條也是很顯瘦"}, {"id": "2609010098", "name": "碎月光 清透皺皺紋理短褲", "category": "短褲", "material": "✦材質成份：37%棉+45%聚酯+17%嫘縈+1%彈性", "description": "批市許願上架款\n顯瘦的褲裙版型真的好可愛！！\n寬鬆緊帶的全圈鬆緊\n長度剛好不怕太短\n吃再飽也不擔心肚子太憋👏\n想找到合適搭配的上身 推薦幾款給妳們\n#神級伴侶 涼感天絲圓領針織背心\n#靈魂伴侶 圓領短版背心\n#穿衣品味 側開衩短版T\n挑最簡約耐搭的上半身 就很時髦好看了😘"}, {"id": "2609010099", "name": "仙女之夏 細肩帶雙層雪紡長洋裝", "category": "洋裝", "material": "✦材質成份：70%聚酯30%尼龍", "description": "這次選品仙氣十足的雪紡長洋裝\n每每曝光私訊就會被灌爆ＸＤ\n下擺的雙層雪紡清透感好美好美\n有一點收腰穿起來不會孕\n長度小隻女孩超友善呦～～\n不想露手臂搭配各種罩衫都好看\n已經有計畫要去海邊度假的 跑咖拍美照的\n請跟魚尾洋一起收XDDD (魚尾洋真的難以割捨🧚"}, {"id": "2609010133", "name": "HEALER Made 流金歲月 磨毛流蘇中長直裙", "category": "裙子", "material": "✦材質成份：38%嫘縈+23%聚酯纖維+35%尼龍+4%彈性纖維", "description": "這是第三次上架\n第一次很多人只買一色 因為選品售價不便宜\n結果收到都回來說想包色!後悔沒有多買一色\n於是我們隔年又上架 但這次廠商沒有出奶白色\n可想而知又一堆人收到裙子之後回來說想包色\n還有小隻女反應她們穿起來太長\n第三次我們乾脆自訂了\n自訂的版型比原本的大一些\n磨毛料比原本薄一點點 南部冬天穿也很可以\n整件有彈性 偏寬鬆但又修飾\nS-XL穿都可以\n孕婦保守估計至少可以穿到七八個月\n因為下擺簡單的流蘇設計真的很好配\n穿著的舒適度又超高\n沒有買過真的很建議包色\n小隻女也一定要好好把握這次機會囤貨"}, {"id": "2609010144", "name": "HEALER Made 舒服爆擊 太空棉大長腿褲", "category": "長褲", "material": "✦材質成份：65%嫘縈+30%尼龍+5%彈性纖維", "description": "太空棉的大長腿褲好特別！\n穿起來舒適度100分\n大長腿褲的版型是黃金版型 人人穿都顯瘦\n比起丹寧布料的大長腿褲\n這款遠看就像一件西褲一樣\n穿去上班很合適\n背面口袋有做漂亮Ｈ刺繡\n可以修飾臀部線條\n長度適中 搭配娃娃鞋也非常好看"}, {"id": "2609010145", "name": "HEALER Made 甜蜜短褲 麻花坑條鬆緊短褲", "category": "短褲", "material": "✦材質成份：95%聚酯纖維+5%蠶絲", "description": "穿起來舒適度爆表的短褲\n細短絨毛的布料上有超漂亮的麻花紋路\n細看會覺得很有質感\n腰頭全鬆緊 褲子版型寬鬆\n肉肉妞穿也非常好看\n這款短褲風格也很好搭配\n可以穿得很休閒或者很正式\n搭配第一名的寵愛女孩毛衣也超級搭"}, {"id": "2609010147", "name": "HEALER Made 喜歡妳 磨毛傘擺短褲裙", "category": "裙子", "material": "✦材質成份：80%聚酯纖維+20%嫘縈", "description": "近年很流行的蓬蓬短裙\n不敢穿這麼蓬短 完全可以參考這款\n磨毛布料讓整件裙子氣質優雅許多\n而且這款是褲裙 內裡是褲子形狀\n只要是褲裙都大大加分！\n材質毛料超級好摸\n且感覺是比較不易起球的那種\n不管搭配什麼可愛感青春感都會up\n但又不失氣質那種！"}, {"id": "2609010153", "name": "時髦寵兒 牛皮流蘇綁帶反褶長靴", "category": "鞋子", "material": "✦材質成份：100%牛皮", "description": "走在流行前面的女孩不能錯過這個綁帶靴\n因為皮革很柔軟\n可以隨性反褶靴筒到自己喜歡的高度\n除了造型功用\n修飾小腿肚這點也是格外有用處!\n皮革上帶點麂皮絨的質感\n另外加上一點點內增高的效果\n舒適好穿又踏在流行尖端的造型靴非他莫屬"}, {"id": "2609010182", "name": "夏日方程式 細帶平底涼鞋", "category": "鞋子", "material": "材質成份： 100%合成皮", "description": "很少看到這麼漂亮的拖鞋細帶\n有點像交叉蝴蝶結\n漂亮又帶有氣質感\n韓國出差時一整天走路也不咬腳!\n無論是搭配褲裝或是洋裝都沒問題!\n腳版厚的肉肉腳掌友善\n版型可以正常拿唷~"}, {"id": "2609010183", "name": "永結同心 蝴蝶結低跟涼鞋", "category": "鞋子", "material": "材質成份：合成皮+聚酯", "description": "這雙從上架前就狂被詢問\n跟不會很高僅有3公分,走路無負擔\n再加上今年最流行的蝴蝶結!!且不會太浮誇,\n低調的優雅!\n搭配洋裝或是露踝的牛仔褲很適合\n參加婚禮很適合唷!\n此款腳板厚建議大半號拿!"}, {"id": "2609010185", "name": "小千金 毛呢斜口袋短裙", "category": "裙子", "material": "材質成份：100%聚酯", "description": "優雅百搭不出錯，特殊斜口袋設計～\n空間居然還放得下手機！\n小香風高級感短裙～表面紋路質感不粗糙～非常精緻\n沒有內襯褲設計，A字版型顯腿細\nS-L號身型皆可穿~非常適合嬌小女孩！"}, {"id": "2609010186", "name": "活力少女 草莓印花短T", "category": "短袖", "material": "✦材質成份：100%棉", "description": "版型合身顯瘦有腰身感\n但不會勒出肉肉!\n夏天就是要來點可愛繽紛的Logo短T🍓\n這款不會太短長度剛剛好\n穿起來看了心情就炸好\n白色很有童趣活潑的氛圍\n灰色是小小低調的可愛女孩🙈"}, {"id": "2609070001", "name": "HEALER Made 舒芙蕾毛衣 鬆軟毛絨V領針織上衣", "category": "針織毛衣", "material": "✦材質成份：100%尼龍", "description": "觸感跟視覺都超級超級療癒～～\n很討喜的水貂毛毛衣\n水貂毛都是不會掉毛的(超級重要！)\n也可以機洗 很好維護\n之前有出過類似的水貂毛上衣但織紋不太一樣\n這款也比那款的毛更短更整齊 很討喜\n版型Ｖ領＋微短版穿起來非常顯瘦\n也是不顯胖的短短毛\n搭配褲裝裙裝都非常好看"}, {"id": "2609070002", "name": "HEALER Made 淺淺秋氛 棉質壓釦口袋襯衫外套", "category": "襯衫", "material": "✦材質成分：100%棉", "description": "只有自訂款會出現的秋裝厚度\n通常韓國選品外套都還是會太厚\n這款的厚薄度台灣早秋穿很可以！\n薄薄的但還是帶有一點挺度\n整體版型穿起來順肩線又有質感\n是委託韓國歐膩製作\n而且顏色我們挑的超美\n有可愛的淺莓果色跟帶一點秋意的杏色\n兩色都很有好感度\n搭配撞色的條紋內搭或是碎花Ｔ都很好看\n真心推薦"}, {"id": "2609070003", "name": "HEALER Made 透明感 V領開襟綁帶襯衫", "category": "長袖", "material": "✦材質成分：65%萊賽爾+20%尼龍+15%醋酸纖維", "description": "一曝光就爆私訊的襯衫\n這款版型帶一點日系氣質感\n領型做得非常漂亮\n布料微微透有挺度\n整體穿起來氣質高雅\n穿去上班也很適合\n版型寬鬆不挑身型\n長度可以遮肚遮一半屁股\n比較瘦的水水如果覺得太寬鬆可以用綁帶繫出腰身\n也很有造型感\n除了牛仔褲西褲之外 搭配短裙長裙也都很美\n推薦本次必收"}, {"id": "2609070005", "name": "HEALER Made 皺皺裙 鬆緊後開衩中長裙", "category": "裙子", "material": "✦材質成分：100%聚酯纖維", "description": "歐膩的款式我們自訂顏色\n每年都會穿爆的皺皺直裙！\n這款有內裡不會透\n但是厚度薄薄的不會太熱\n版型也做得很順不會顯肚子顯屁股\n原本就是歐膩熱賣好幾年的款式\n長度更是小隻女友善\n黑色顯瘦 灰色很獨特 奶白很氣質\n完全可以跟冷凍褲水感裙一樣囤起來"}, {"id": "2609070008", "name": "女團進行式 配色條紋繡花口袋連帽外套", "category": "外套", "material": "✦材質成分：65％棉+30％聚酯+5％彈性", "description": "超可愛的棉質連帽外套\n除了條紋配色很順眼之外\n後面的繡花設計很有流行感\n整體穿起來寬鬆落肩但有做雙向拉鍊\n所以穿起來比例還是很好\n比較想露身體曲線的話可以裡面穿合身bratop\n或面膜Ｔ搭配寬褲\n很像女團成員(雙眼愛心)"}, {"id": "2609070010", "name": "天生會搭 開襟假兩件式坑條上衣", "category": "長袖", "material": "✦材質成分：100%棉", "description": "這次有兩款假兩件式上衣都很推薦\n這款版型比較合身 但不會貼身\n材質是坑條棉料 薄薄的很親膚\n配色也很有質感\n有今年還是很流行的葡萄酒紅跟經典的黑灰配色\n裡面那件打開第一顆扣子自然垂下來的樣子很好看\n隨意搭一件寬褲就很好看很會搭"}, {"id": "2609070011", "name": "撞色巧思 配色條紋柔軟半開襟針織衫", "category": "長袖", "material": "✦材質成分：83％聚酯+8％尼龍+6％羊毛+3％彈性", "description": "這款的配色都超級可愛\n不管是咖配藍還是酒紅配綠\n也是選色非常困難的一款\n雖然酒紅細看有點偏紫\n但這個顏色穿起來卻很有女人味\n針織超級親膚舒適\n厚度不會太厚\n版型也不會太貼身\n穿起來很自在\n是可以輕鬆轉換季節的衣款"}, {"id": "2609070013", "name": "想天天穿 假兩件式配色背心小外套上衣", "category": "長袖", "material": "✦材質成分：70％棉+30％聚酯", "description": "我們自己很喜歡的款式\n一樣是懶人的假兩件式但不挑身形\n除了搭牛褲短裙穿得休閒可愛之外\n感覺媽媽們穿也很漂亮\n連裡面的背心都不會合身的款式很難找\n這款的配色跟繡花也都做得很完美\n而且這款的材質舒服 手臂不合身\n感覺每天都會想穿它！"}, {"id": "2609070014", "name": "深焙拿鐵 Q彈細條紋長袖T", "category": "長袖", "material": "✦材質成分：70%棉+27%聚酯+3%彈性", "description": "彈性極佳的百搭條紋T\n觸感非常舒服\n仔細感覺表層有一點磨毛的棉感\n很適合當秋冬的內搭\nv字開襟領的造型更顯臉小\n剪裁順身不合身\n單穿很Ok也不單調無聊👍"}, {"id": "2609070021", "name": "圖一個自在 條紋雙肩帶造型BRATOP", "category": "BRATOP", "material": "✦材質成分：100%棉", "description": "這款我先推薦大家包色😆\n因為大部分bratop都是出素色素面的\n像這件條紋款\n排扣(釦子不可開)+雙肩帶造型的領型\n可以讓搭配更有變化！\n襯墊是不可拆的 洗滌很方便☝️\n內圈有下鬆緊支撐\n襯墊舒適透氣 穿起來很自在\n推薦大家可收！"}, {"id": "2609070026", "name": "玩色概論 拼色英文繡花棒球帽", "category": "帽子", "material": "✦材質成分：100棉%", "description": "帽簷跟帽身做不同的顏色\n算是存在感蠻高的棒球帽\n帽型好看修飾臉型\n英文字體的設計也不幼稚\n整頂帽子就是自帶重點\n平常出門不想整理頭髮也能很有型😎✨"}, {"id": "2609070027", "name": "野餐日 細格紋寬鬆襯衫", "category": "長袖", "material": "✦材質成分：100%棉", "description": "真是不打算放過格紋控了\n粉格好好看帶一點紫色線條很特別\n另外布料上也比肉眼看的感覺\n更薄又透氣也很親膚\n長度是可以蓋住屁股的\n側邊也有弧形剪裁\n不呆版又能修飾兩側"}, {"id": "2609070029", "name": "工裝風入門款 抽繩工裝長裙", "category": "裙子", "material": "✦材質成分：100%尼龍", "description": "還沒試過工裝風的可以從這件開始\n大家都可以輕鬆駕馭的基本樣式\n腰頭整圈鬆緊+同色的棉料抽繩\n後開衩方便走動\n尼龍唰唰布的質料\n好搭又有特色\n是非常經典款的工裝長裙！"}, {"id": "2609070033", "name": "HEALER Made Q彈麻糬般 柔軟半領細條紋長袖T", "category": "長袖", "material": "✦材質成份：82%縲縈+14%聚酯纖維+4%彈性纖維", "description": "前哨站直接秒殺的超爆款\n每個人拿到料子都會讚嘆的那種等級\n真的就像麻糬一樣Ｑ彈 可以拉成三倍大ＸＤ\n但是厚度又很適中\n我覺得這個厚度甚至是南部冬天穿也可以\n整體的版型也做很棒\n半領設計 短脖或圓臉都可以駕馭\n版型不貼身 穿起來有種自然的顯瘦感\n不管搭配背心或各種外套都是神器\n請至少包兩色以上"}, {"id": "2609070034", "name": "HEALER Made 蛋糕仙子 細褶層次蛋糕紗裙", "category": "裙子", "material": "✦材質成份：主布:100%聚酯纖維 裡布:94%聚酯纖維+6%彈性纖維", "description": "這款我看到價格也是嚇一跳\n真心是非常重工的一件紗裙 用料很好\n版型更是不可多得\n很挑圓裙的圓身穿也非常好看的版型(讚)\n外層的紗很輕盈 隨意走動就很有飄逸感\n內裡不會很透 闆娘試過內搭黑褲襪也不會直接透出來\n裙頭是一整圈鬆緊 那種露出來也很美的腰頭\n長度適中 穿起來超有仙氣\n真心推薦會穿紗裙的妳一定要入手"}, {"id": "2609170001", "name": "常伴左右 植絨文字印花刷毛長袖T", "category": "長袖", "material": "✦材質成份：62%聚酯+34%腈綸+4%彈性", "description": "就像多年好友常伴左右的英文字Ｔ\n單穿內搭都非常適合所以歷久不衰\n這款不是普通的英文字Ｔ\n來自貴棟的內刷毛材質非常好\n英文字也是貼上去的\n整件很有質感\n英文字的配色也配得很漂亮\n害我們很難捨棄任何一色QQ"}, {"id": "2609230001", "name": "HEALER Made 水波洋 細褶捲邊短袖長洋裝", "category": "洋裝", "material": "✦材質成分：100%聚酯纖維", "description": "已經賣了無數年品牌洋跟魚尾洋的我們\n真的沒想到還有可以與其匹敵的款式\n水波洋的布料跟捲邊真心太太太可愛\n他的版型也介於品牌洋的直筒跟魚尾洋的傘狀之間\n算是非常好搭配的版型\n整件布料一樣彈性超級好 不皺 耐洗\n都是很好維護的布料\n雖然看起來蠻寬鬆的 肉肉妞跟孕婦友善\n但即使是XS身型穿起來也很好看\n我們跟歐膩合作推出自訂款\n小隻女穿也沒有問題！\n這款在台灣可以穿春夏秋三季\n非常推薦可以包色！！"}, {"id": "2609230002", "name": "HEALER Made 完美連線 細紋理天絲連袖襯衫", "category": "長袖", "material": "✦材質成分：天絲82%+尼龍18%", "description": "韓國自訂款 我們自己去布市找的布料\n漂亮的版型配上舒適的布料就是一件完美的襯衫\n質料非常舒服透氣\n布料的髮絲紋跟微微光澤非常漂亮\n重點是版型超好搭配\n不管搭裙裝褲裝都是不用紮的完美長度\n款式也很適合穿去上班\n隨意搭件西褲就很好看\n布料不到很透但是搭配深色內搭還是會透喔"}, {"id": "2609230003", "name": "HEALER Made 立秋 鬆緊腰寬鬆舒適長褲", "category": "長褲", "material": "✦材質成分：52%尼龍+48%嫘縈", "description": "韓國自訂款\n布料穿起來超級涼感！\n夏天穿也沒有問題\n整圈鬆緊 穿起來很舒服\n鬆緊帶有束縛力但彈性也好\n打摺的設計很遮肚子跟胯寬\n不知道穿什麼的時候就會想穿這種褲子\n日常愛用褲子第一名"}, {"id": "2609230004", "name": "HEALER Made 神作 燈芯絨拚領工裝外套", "category": "外套", "material": "✦材質成分：主布:100%棉 裡布:100%聚酯纖維", "description": "稱為神作當之無愧!!\n整件都太完美\n布料類似棉斜紋布 不會太厚\n拼接燈芯絨很好搭配\n內裡超舒服 整件有挺度但又輕\n內裡還有一個超有質感的內袋！\n下擺抽繩可調整版型跟長度\n精選皮標畫龍點睛\n版型更是超好搭配 不會太長太寬\n所有身型穿都好看\n請至少入手一色\n(我自己都很選色困難ＴＴ)"}, {"id": "2609230005", "name": "HEALER Made 巴黎優雅 滾邊條紋鬆餅格寬鬆上衣", "category": "長袖", "material": "✦材質成分：95%聚酯纖維+5%彈性纖維", "description": "結合超多細節的法式條紋Ｔ\n精選超舒服彈性好的鬆餅格棉料\n整件柔軟不會硬硬的\n穿上去會很滿意那個舒適度\n肩線的滾邊跟立體的LOGO都超可愛\n寬袖慵懶 微微短版不用紮就有好比例\n簡單搭配牛仔褲休閒好看\n甚至搭配紗裙也很法式感"}, {"id": "2609230006", "name": "慵懶女孩 大圓領露肩寬鬆條紋上衣", "category": "長袖", "material": "✦材質成分：65％腈綸+15％聚酯+15％嫘縈+5％彈性", "description": "大圓領可以拉斜肩\n露一邊鎖骨就很慵懶\n這款材質類似針織棉\n高質感棉料的視覺感\n材質親膚 厚度中等 感覺可以穿到臺灣冬天\n除了經典黑白之外 藍色很有特色\n穿起來非常顯白"}, {"id": "2609230007", "name": "歐夏蕾 麂皮傘襬背心兩件式上衣", "category": "長袖", "material": "✦材質成分：上衣:85％棉+15％聚酯 背心:100％聚酯", "description": "真兩件式 穿起來超可愛又時髦的款式\n今年流行的疊穿配上傘擺設計瞬間可愛起來\n也算很難得可以找到的款式\n雖然是娃娃裝但配上麂皮中和女生感\n裡面素T跟外面背心彈性都很好\n穿起來很舒服\n真兩件是這個價格真的有點驚喜！！"}, {"id": "2609230008", "name": "Bratop天花板 蕾絲細肩帶BRATOP背心", "category": "BRATOP", "material": "✦材質成分：", "description": "絕對是至今看過Bratop的質感天花板\n裡裡外外都是\n裡面翻開有點像縫了一件Bra在裡頭\n胸墊不可拆\n很喜歡這款蕾絲的配色 配得超好看！\n而且蕾絲滾小小圈的 整體更好搭配\n版型比較適合小骨架或小胸喔"}, {"id": "2609230009", "name": "夢想之地 森林印花大學T", "category": "長袖", "material": "✦材質成分：100％棉", "description": "久違選到漂亮印花的大學T\n圖案是有氣質的那種\n也讓我想到不久前非常驚艷的紐西蘭\n遠山搭配湖景\n看著就很放鬆\n這款的版型不會太長太大\n搭配上更容易\n下擺卡在髖骨上整體比例就很好\n袖子比較長所以穿起來更慵懶\n不會有合身感\n材質內裡是一般毛巾布唷"}, {"id": "2609230010", "name": "舒適區 皺皺細褶圓領長袖T", "category": "長袖", "material": "✦材質成分：100％聚酯", "description": "近幾年韓國特殊布料真的很厲害\n以前覺得會有點刺膚或彈性不好的波紋T\n這款完全沒有這些問題\n領口雖然做得有點高但很好穿脫\n整件彈性很好\n也因為領口高高的穿起來很有氣質\n單穿不會太休閒\n搭配洋裝也很漂亮\n真心推薦"}, {"id": "2609230011", "name": "洛杉磯 印花七分袖棒球T", "category": "長袖", "material": "✦材質成分：80％棉+15％嫘縈+5％彈性纖", "description": "又是一款一穿就會覺得超舒服的棒球T\n今年棒球T又流行回來了\n有很多款式太小件或太寬鬆\n但這款版型非常適中\n長度剛剛好＋下擺圓弧\n穿起來很修飾身型\n棉料滑順舒服\n日常穿會很愛"}, {"id": "2609230012", "name": "舒心T 柔軟厚棉短袖T", "category": "短袖", "material": "✦材質成分：85％棉+15％天絲", "description": "一穿就會很想+1的Ｔ\n布料真的超級舒服\n微微磨毛又有彈性\n穿了就不想脫那種\n而且版型尺寸超適中\n寬鬆不貼身 穿起來很自在\n完全是包色級素T"}, {"id": "2609230013", "name": "最後一抹夏 細格紋寬鬆襯衫", "category": "長袖", "material": "✦材質成分：100%棉", "description": "這配色是又要讓格襯控再度失守\n清新可愛的低飽和格紋\n不高調卻又很有亮點\n版型是寬鬆長版的休閒感\n除了當上衣\n直接當外罩也好看\n長度還可以遮住平時會在意的胯寬\n顯得人嬌小許多！"}, {"id": "2609230017", "name": "夢想家 細壓褶單釦外套", "category": "長袖", "material": "✦材質成分：100%聚酯", "description": "超有氣質的漂亮罩衫\n是任何背心跟細肩帶洋裝的穿搭好幫手\n設計很簡約就是單一個勾釦\n加上布料的壓褶穿起來很顯瘦\n下襬和手袖自然的垂墜度也很唯美\n簡約又有造型感\n黑白兩個基本色都非常的實搭‼️"}, {"id": "2609230018", "name": "暮色 細肩帶格紋雪紡短洋裝", "category": "洋裝", "material": "✦材質成分：100%聚酯", "description": "有點個性又不失優雅的菱格紋\n細肩帶的部分不能調長短喔\n但實際我們試穿領口的高度蠻適中的\n如果身高165的女生裙長可能會有一點點短\n可以當成長版上衣\n搭配長褲也很有日系感！\n腰綁帶可以綁前或綁後\n後背有拉鍊穿脫還算方便\n雪紡面料的飄逸感很水👍"}, {"id": "2609230019", "name": "娜塔莉 小花彈性皺皺捲邊微喇褲", "category": "長褲", "material": "✦材質成分：100%聚酯", "description": "韓國歐膩們很愛穿的顯瘦+長腿微喇褲\n真的是有腿長+5公分的厲害效果\n不過這件褲長是比較長的\n會適合165cm的女孩們喔！\n如果修改長度\n褲口的捲邊設計會被裁掉有一點點小可惜\n皺皺布料+小印花的圖案\n很低調俏皮\n搭配上也沒有像中困難\n像配個大學Ｔ就很好看了"}, {"id": "2609230020", "name": "雙腿自在 毛料後口袋鬆緊打褶短褲", "category": "短褲", "material": "✦材質成分：82%聚酯+14%嫘縈+4%彈性", "description": "短褲的布料開始有適合秋冬氣溫的材質\n深灰色是帶點混織感很特別\n褲管比較寬鬆 褲長不會太短\n全鬆緊彈性褲頭\n穿著體感蠻舒服的\n腰下打褶設計可以修飾小腹\n也因為多了後口袋\n屁屁不會太貼合\n搭配上來說也不會顯得整體太過休閒居家"}, {"id": "2609230021", "name": "小個女孩命定 靴型彈性牛仔褲", "category": "長褲", "material": "✦材質成分：95%棉+5%彈性", "description": "本期新品這件牛仔褲的長度超適合小個女孩！\n長度是完美在腳踝的位置\n真的是小隻女的福音～～\n另外像是O型腿、X型腿\n靴型設計也可以好好的修飾腿部線條\n還有一個加分點\n屁股口袋的設計有釦子和上蓋的布\n視覺上讓臀更集中然後更顯翹！😘\n顏色上是偏原色牛仔的深藍\n所以也有顯瘦的效果喔"}, {"id": "2609230022", "name": "陪你過日子 後鬆緊小傘襬短褲裙", "category": "裙子", "material": "✦材質成分：100%棉", "description": "很喜歡這件的長度不會太短\n是可以把大腿肉肉藏好的短褲裙\n裙子版型也不會太窄\n加上後鬆緊\n整體休閒可愛 日常實搭\n內裏是有褲子的 讓人很有安全感\n灰杏百搭 咖色跟這次很多的上衣都超配 充滿秋冬感🍁"}, {"id": "2609230023", "name": "製造曼妙 抽繩側開衩魚尾長裙", "category": "裙子", "material": "✦材質成分：45%聚酯+35%棉+2%彈性", "description": "滑面的布料穿著感超級舒服\n有莫代爾棉的舒適又有太空棉的挺度‼️\n結合兩大優點於一身💯\n也是休閒+性感並具\n腰頭是比較寬版的全鬆緊帶\n也有做固定不用擔心會翻轉\n彈性空間夠大還有抽繩可調節腰圍\n走路的時候隱約透過開衩露出小腿線條\n超級好看🥰"}, {"id": "2609230024", "name": "森林仙子 細褶網紗蛋糕裙", "category": "裙子", "material": "✦材質成分：100%聚酯", "description": "有在敲碗我們自訂款蛋糕仙子出深色的朋友\n趕快來瞧瞧這件！！！\n這款紗裙兩色都是秋冬色調\n咖啡算是很深的那種(拍照某些角度會有點像深黑)\n是很低調的顏色\n卡其綠則是飽和度比較高帶點綠色\n帶有暖調卡其這色意外的好搭配\n兩色的實體都很漂亮！\n垂墜度很修飾身形 也不會顯屁股\n各位仙女~~~~手刀購入！"}, {"id": "2610160001", "name": "HEALER X Clina 開心果羊毛針織外套", "category": "外套", "material": "✦材質成分：50%再生聚酯+30%尼龍+11%聚酯纖維+8%羊毛+1%彈性纖維", "description": "這次逸歡自訂款最多人詢問的款式！！\nOversize配上可愛立體毛感的布料\n在選品裡幾乎看不到這樣的設計\n逸歡選的顏色也獨特又漂亮\n芥末黃完全就是開心果的顏色\n看了很有好感 穿起來又顯白\n燕麥也很特殊 近看是米白混織黑色\n遠看就是超好搭配的杏色系\n超愛這個蓋臀的長度 慵懶好搭配\n裡面配厚毛衣也沒問題\n布料混織8%的羊毛\n闆娘去韓國實測15度穿也保暖！"}, {"id": "2610160002", "name": "HEALER X Clina 大V鐵則 天絲V領開襟上衣", "category": "長袖", "material": "✦材質成分：嫘縈35%+天絲30%+聚酯纖維30%+彈性纖維5%", "description": "這款真的修超久！！\n為了修到所有身型穿都最顯瘦的版型\n大Ｖ領真的完全是顯瘦鐵則！\n穿起來就是永遠比別人瘦\n逸歡原本更想要更貼她手臂的合身度\n但我們找到一個肉肉手臂穿跟她穿都好看的中等貼度\n這款軀幹也非常友善\n也是屬於沒腰人穿也很顯瘦的版型(逸歡是沒腰人)\n老客人都知道混織天絲的觸感極佳\n這件會是你想每天拿出來穿的百搭上衣！"}, {"id": "2610160003", "name": "HEALER X Clina 最顯瘦兩件式造型綁帶上衣", "category": "長袖", "material": "✦材質成分：聚酯纖維80%+嫘縈15%+彈性纖維5%", "description": "我要封這款為最最顯瘦的兩件式造型的薄長袖\n一開始逸歡說要做假兩件式我還心想完蛋了 穿起來很顯胖\n結果一做出來試穿真的超!級!驚!艷!\n穿起來真心顯瘦 而且木耳邊也很可愛\n讓早就想跟上疊穿風潮的我超想包色！\n質料穿起來百分百舒服 彈性很好\n不管是軀幹還是手臂都不貼身\n兩側有綁帶可以綁出腰身\n穿起來身材會變得很好\n真心大推至少包兩色"}, {"id": "2610160004", "name": "HEALER X Clina  常春藤 翻領五分袖針織衫", "category": "短袖", "material": "✦材質成分：72%嫘縈+28%聚酯纖維", "description": "高級感的代表\n穿起來就是全身很貴氣的感覺\n逸歡指定比較合身的版型\n搭配直紋坑條穿起來很顯瘦！！\n雖然合身但是針織的彈性很好\n也是很親膚的質料\n這款的顏色太難選了\n棕色穿起來很有味道又顯白\n但黑色穿起來又無敵顯瘦"}, {"id": "2610160005", "name": "HEALER X Clina 牛仔牧場 水洗牛仔短褲裙 SML", "category": "裙子", "material": "✦材質成分：100%棉", "description": "這個版型是逸歡自己超愛的版型\n他愛到想做5色以上ＸＤＤ\n但礙於起訂量高 她很艱難的挑選出她最愛的棕色\n這款穿起來一點都不像在穿牛仔裙\n丹寧的彈性超級好！\n而且穿起來真心很藏肚藏肉\n延續她愛的高腰版型 穿起來有肚子也會包得好好的\n必須要大推\n是一款一穿就會很想自留的褲裙"}, {"id": "2610160007", "name": "HEALER X Clina 無限驚奇 格紋磨毛打摺寬褲 附皮帶", "category": "長褲", "material": "✦材質成分：聚酯纖維80%+嫘縈19%+彈性纖維1%", "description": "穿起來絕對會讓你非常驚艷的格紋褲\n極致舒服！極致顯瘦！\n這款布料有磨毛但厚度中等\n不厚重且薄軟 但又有很修飾的垂墜感\n褲管有點點彎刀感\n整條穿起來形狀非常好看\n沒腰的闆娘穿起來都有腰了！\n腰帶是附的 皮質柔軟質感很好\n加皮帶除了更有型之外 也能修飾肚子\n褲長有分正常版跟小隻女版\n只有差在長度不一樣\n身高162的闆娘剛好在交界處 兩個長度都可以穿喔"}, {"id": "2610160009", "name": "Clina Pick！丹寧之戀 水洗立領牛仔外套", "category": "外套", "material": "✦材質成分：100%棉", "description": "眼睛一亮的漂亮牛仔外套\n首先是顏色真的太美了\n任何膚色穿起來都很提亮\noversize的設計但是長度不會太長\n小隻女也可以駕馭\n立領可以變換成翻領 穿起來不會太個性\n丹寧有挺度 整體質感超好"}, {"id": "2610160010", "name": "Clina Pick！小黑馬 側抽皺修身上衣", "category": "長袖", "material": "✦材質成分：57％棉+37％莫代爾+6％彈性", "description": "看起來很素但穿起來就是很瘦\n有很多魔鬼細節\n一個是大Ｕ領\n整個修飾臉型跟肩寬\n側抓皺修飾腰線 把肚肚肉藏起來\n衣長剛剛好不會紮\n下擺圓弧也會有顯瘦效果\n布料彈性好 穿起來很舒服"}, {"id": "2610160011", "name": "Clina Pick！漂亮心機 繞脖假兩件式上衣", "category": "長袖", "material": "✦材質成分：62％聚酯+33％嫘縈+5％彈性", "description": "穿起來很電人的上衣\n前片的垂墜感有大胸效果\n連帶腰線也修飾出來\n兩邊都有側抓皺 所以腰間有贅肉也不怕\n偏薄但布料很舒服\n也是剛剛好不用紮的衣長\n逸歡跟闆娘都很愛的款式 大推"}, {"id": "2610160012", "name": "Clina Pick！減10歲 燈芯絨口袋寬版七分褲", "category": "短褲", "material": "✦材質成分：100％棉", "description": "還沒上架呼聲就很高\n一樣是喜歡這款就必須把握這檔！\n現在最流行的七分褲\n穿起來非常減齡且出乎意料的好搭\n上身可以搭配合身或寬鬆上衣\n穿起來都非常合理\n整圈腰鬆緊也非常大件\n肉肉妞或孕婦穿都可以\n兩色都超好看ＱＱ好難選"}, {"id": "2610160013", "name": "自帶腰身 斜下襬側抓褶上衣", "category": "長袖", "material": "✦材質成分：100％棉", "description": "雖然這次有很多棉Ｔ\n但每款都各有千秋啊啊啊啊\n很難割捨\n這款相較其他款算蠻肉肉友善\n穿起來整件都比較寬鬆一點\n但也是非常厲害自帶腰身的一款\n衣長穿起來全身比例也非常好\n相較其他棉料比較不透的布料\n腰線不是合身的 比較不喜歡穿太貼身可以選這款"}, {"id": "2610160014", "name": "白領族 拼接翻領半開襟針織衫", "category": "長袖", "material": "✦材質成分：72％腈綸+18％棉+10％尼龍", "description": "一看就非常有氣質的款式\npolo領的風潮還在延燒\n這款簡約又知性\n搭配牛褲或長裙都很好看\n針織親膚 厚薄度適中\n整件不會貼身 是很不挑身型的款式\n上班穿也超適合！"}, {"id": "2610160015", "name": "史努比好朋友 印花大學T", "category": "長袖", "material": "✦材質成分：100%棉", "description": "看到史努比就要尖叫一下！\n這款一樣不是內刷毛的\n台灣比較容易穿到\n雖然是長版的但小隻女穿也不會太長\n整體是慵懶可愛的感覺\n很好搭配又不容易髒的花灰色\n一樣很推薦"}, {"id": "2610160016", "name": "理科校花 拉鍊翻領下抽繩口袋大學T", "category": "長袖", "material": "✦材質成分：50％棉+50％聚酯", "description": "俏皮小男孩風的大學T\n拉鍊如果全拉可以變成立領有防風的作用\n下襬抽繩拉緊簡單配個牛仔褲\n比例就會很好了\n或配裙子走一個甜姐的路線也好看\n這款沒有內刷毛 台灣的天氣很實穿🥰\n兩側有剪接車線設計延升到口袋\n整件不單調無聊 耐穿百搭不退流行"}, {"id": "2610160017", "name": "我心有你 V領簍空布蕾絲傘襬上衣", "category": "短袖", "material": "✦材質成分：84％嫘縈+16％聚酯", "description": "闆娘說選品的時候\n在一大片秋冬深色針織毛料衣服裡面\n這款就像一股清流😆\n布料帶飄逸的漂亮仙女上衣\n加上布蕾絲簍空的設計\n很修飾身型的小傘襬剪裁\n帶出小荷葉的滾邊\n整件很小女人的風格"}, {"id": "2610160018", "name": "皇后的新衣 圓領透膚打底上衣", "category": "長袖", "material": "✦材質成分：70％天絲+30％羊毛", "description": "觸感接近不存在的薄料內搭\n很親膚透氣\n非常適合春秋微涼的天氣\n可以疊穿在各個洋裝、背心裡面\n背面有小綴飾跟中線造型的設計\n簡單的內搭也有小亮點"}, {"id": "2610160019", "name": "秋夜 假兩件背心針織衫", "category": "長袖", "material": "✦材質成分：100％聚酯", "descri let banned = [], liked = [], finals = [];
let sample = null, db = null, maxImages = 0, ctl = null;

function saveLocal(){try{localStorage.setItem(DRAFT_KEY, JSON.stringify({form:readForm(), result, draft}))}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY))}catch(e){return null}}

// ---------- form ----------
for (const c of DATA.categories) $('category').append(el('option',{value:c,textContent:c}));
const FIELDS = ['name','category','colors','material','background','feeling'];
function readForm(){return Object.fromEntries(FIELDS.map(f=>[f,$(f).value.trim()]))}
FIELDS.forEach(f=>$(f).addEventListener('input',saveLocal));

function renderThumbs(){
  const box=$('thumbs');box.replaceChildren();
  photos.forEach((file,i)=>{
    const url=URL.createObjectURL(file);
    box.append(el('div',{class:'thumb'},el('img',{src:url,alt:`照片 ${i+1}`,onload:()=>URL.revokeObjectURL(url)}),
      el('span',{textContent:String(i+1).padStart(2,'0')}),
      el('button',{type:'button',class:'ghost',textContent:'✕',title:'移除',onclick:e=>{e.stopPropagation();photos.splice(i,1);renderThumbs()}})));
  });
  const cap = maxImages ? `，最多 ${maxImages} 張` : '';
  $('dropText').textContent = photos.length ? `已選 ${photos.length} 張${cap}（可再加入）` : `點這裡或把照片拖進來（全身照＋細節照最好${cap}）`;
}
function addFiles(list){
  const ok=[...list].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));
  photos=photos.concat(ok);
  if(maxImages&&photos.length>maxImages){photos=photos.slice(0,maxImages);setStatus(`一次最多 ${maxImages} 張，多的已略過。`,true)}
  renderThumbs();
}
$('drop').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')$('files').click()});
$('drop').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('files').click()}});
$('files').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('over')}));
$('drop').addEventListener('drop',e=>addFiles(e.dataTransfer.files));

function setStatus(msg,err=false){$('status').textContent=msg;$('status').className='status'+(err?' err':'')}

// ---------- prompt ----------
function bigrams(t){const s=new Set();for(let i=0;i<t.length-1;i++)s.add(t.slice(i,i+2));return s}
function core(n){return n.replace(/HEALER( Made| X \w+)?|Clina Pick！|S-XL|S\/M|[\s!！]/g,'')}
function similarity(a,b){const x=bigrams(core(a)),y=bigrams(core(b));const u=new Set([...x,...y]);if(!u.size)return 0;let n=0;for(const v of x)if(y.has(v))n++;return n/u.size}
const SCENE=/水水|喜歡|適合|春|夏|秋|冬|上班|通勤|約會|出遊|日常|女孩|的妳/, HOOK=/！|!|愛|太|最|很少|驚艷|厲害|爆表|紅了|挑戰|終於|回歸|久違|眼睛一亮/;
const firsts=DATA.pool.map(p=>p.description.split('\n').map(s=>s.trim()).find(Boolean)||'');
const sceneOpeners=firsts.filter(f=>SCENE.test(f)), hookOpeners=firsts.filter(f=>HOOK.test(f)&&!SCENE.test(f));
function pick(arr,n){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}

function buildPrompt(f){
  let cands=DATA.pool.filter(p=>p.category===f.category);
  if(cands.length<3)cands=DATA.pool;
  const examples=[...cands].sort((a,b)=>similarity(f.name,b.name)-similarity(f.name,a.name)||a.id.localeCompare(b.id)).slice(0,3);
  const ex=examples.map((p,i)=>`### 範例 ${i+1}：${p.name}\n材質：${p.material}\n官網商品資訊：\n${p.description}`).join('\n\n');
  const likes=liked.slice(0,LIKES_SENT).map(l=>`- ${l.text}`).join('\n')||'（還沒有）';
  const bans=banned.map(b=>`- ${b.phrase}`).join('\n')||'（還沒有）';
  const fins=finals.slice(0,FINALS_SENT).map((x,i)=>`### 定稿 ${i+1}：${x.name}（${x.category}）\n${x.lines.map(l=>l.text).join('\n')}`).join('\n\n')||'（還沒有）';
  return `${DATA.rules}

**使用者補充的資訊：** 下方「背景資訊」「自身感受」是使用者親口提供的，可以直接用 Healer 語氣寫進文案，不必加方括號；但不能延伸出使用者沒說的內容。自身感受要寫成小編口吻（例如「小編162穿S剛好」），不要整段照抄。

${DATA.style}

# 新商品
商品名稱：${f.name}
類別：${f.category}
官方色名：${f.colors||'（未提供）'}
材質：${f.material||'（未提供）'}
照片：隨訊息附上的 ${photos.length} 張圖片，依上傳順序編號 01 到 ${String(photos.length).padStart(2,'0')}

# 使用者補充
背景資訊：${f.background||'（無）'}
自身感受：${f.feeling||'（無）'}

# 團隊訓練紀錄（優先於上面的一般規則）
## 絕對不要出現的字詞（任何版本都不能用，換別的說法）
${bans}

## 團隊喜歡的句子（學它們的口氣與角度，不要照抄、不要沿用其中的商品事實）
${likes}

## 團隊最近的定稿（最貼近團隊想要的成品，學結構與節奏）
${fins}

# 同店其他商品的真實文案（只學語氣與結構，不可沿用它們的商品事實）
${ex}

# 本商品的開頭參考（官網其他商品的真實第一行，只學口氣與角度）
路線 A：${pick(hookOpeners,OPENERS).join(' ／ ')}
路線 C：${pick(sceneOpeners,OPENERS).join(' ／ ')}

# 輸出格式
只回一個 JSON 物件，不要其他文字：
{"target":"一句話說明本商品是照片中的哪一件","details":["細節（照片編號）"],"A":["路線A 第一行","第二行"],"B":["..."],"C":["..."]}
A、B、C 每個元素是一行文案。`;
}

// ---------- generate ----------
const ERR={not_granted:'沒有允許這個頁面使用 Claude，所以無法寫作。',sampling_disabled:'這個帳號目前不能從頁面使用 Claude。',
  rate_limited:'使用量到上限或呼叫太頻繁，請稍後再試。',session_expired:'登入已過期，請重新登入 claude.ai。',
  image_rejected:'有照片無法讀取或太大，請換一張。',images_unavailable:'這個檢視不能傳送照片給 Claude。',
  refused:'Claude 拒絕了這次的內容，請調整後再試。',invalid_json:'回覆格式不完整，請再按一次。',prompt_too_large:'資料太長，請減少照片或補充文字。'};
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const f=readForm();
  if(!sample){setStatus('要在 claude.ai 上登入並開啟這個頁面，才能寫作。',true);return}
  if(!photos.length){setStatus('請先上傳至少一張商品照。',true);return}
  if(!f.name){setStatus('請填商品名稱。',true);$('name').focus();return}
  ctl=new AbortController();
  $('go').disabled=true;$('stop').hidden=false;
  setStatus(`正在看 ${photos.length} 張照片並寫三種版本，通常要 1 到 2 分鐘……`);
  try{
    const out=await sample.json(buildPrompt(f),{images:photos,modelTier:'complex',cache:false,signal:ctl.signal});
    const lines=k=>Array.isArray(out?.[k])?out[k].map(s=>String(s).trim()).filter(Boolean):[];
    if(!lines('A').length||!lines('B').length||!lines('C').length)throw{code:'invalid_json'};
    result={target:String(out.target||''),details:Array.isArray(out.details)?out.details.map(String):[],A:lines('A'),B:lines('B'),C:lines('C')};
    meta={name:f.name,category:f.category,colors:f.colors,material:f.material};
    draft=[];setStatus('完成。點句子加入右下的「我的文案」。');
    saveLocal();renderResult();renderDraft();
  }catch(err){
    if(err?.code!=='cancelled')setStatus(ERR[err?.code]||'連線中斷，請再按一次。',true);else setStatus('已停止。');
  }finally{$('go').disabled=false;$('stop').hidden=true}
});
$('stop').addEventListener('click',()=>ctl?.abort());

// ---------- results ----------
function bannedIn(text){return banned.map(b=>b.phrase).filter(p=>p&&text.includes(p))}
function markBanned(text){
  const hits=bannedIn(text);const span=el('span');
  if(!hits.length){span.textContent=text;return span}
  const re=new RegExp('('+hits.map(h=>h.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
  text.split(re).forEach((part,i)=>span.append(i%2?el('mark',{textContent:part,title:'這是「不要再出現」的字詞'}):part));
  return span;
}
function renderResult(){
  const r=result||{...DATA.example,example:true};
  const m=result?meta:{name:DATA.example.name,category:DATA.example.category,colors:DATA.example.colors,material:DATA.example.material};
  $('banner').textContent=result?`${m.name}　｜　${m.category}${m.colors?'　｜　'+m.colors:''}`:`範例：${m.name}（第五輪試寫的真實輸出）。上傳你的商品照後，這裡會換成你的結果。`;
  $('target').textContent=r.target?`認出的商品：${r.target}`:'';
  const cols=$('cols');cols.replaceChildren();
  const used=new Set(draft.map(d=>d.text));
  const likedSet=new Set(liked.map(l=>l.text));
  for(const[k,label]of Object.entries(ROUTES)){
    const col=el('div',{class:'col '+k},el('header',{},el('h3',{textContent:`${k}｜${label}`})));
    let warn=0;
    r[k].forEach(t=>{
      if(bannedIn(t).length)warn++;
      const txt=el('span',{class:'txt'+(hasBracket(t)?' br':''),title:'點一下加入我的文案；反白文字可設成不要再出現',onclick:()=>{if(String(getSelection()).trim())return;draft.push({text:t,from:k});afterDraft()}});
      txt.append(markBanned(t));
      txt.dataset.route=k;
      const on=likedSet.has(t);
      col.append(el('div',{class:'line'+(used.has(t)?' used':'')},txt,
        el('button',{type:'button',class:'icon heart'+(on?' on':''),textContent:on?'♥':'♡',title:on?'取消喜歡':'喜歡這句',ariaLabel:on?'取消喜歡':'喜歡這句',onclick:()=>toggleLike(t,k)})));
    });
    col.append(el('div',{class:'colfoot'},
      el('button',{type:'button',class:'ghost',textContent:'整篇用這版',onclick:()=>{draft=r[k].map(t=>({text:t,from:k}));afterDraft()}}),
      el('button',{type:'button',class:'ghost',textContent:'整版都喜歡',onclick:()=>likeAll(r[k],k)})));
    if(warn)col.append(el('div',{class:'status err',textContent:`有 ${warn} 行用了「不要再出現」的字詞`}));
    cols.append(col);
  }
  const det=$('details');det.replaceChildren();
  if(r.details?.length){det.append(el('summary',{textContent:`Claude 從照片看到的細節（${r.details.length} 項）`}),el('ul',{},...r.details.map(d=>el('li',{textContent:d}))));det.hidden=false}else det.hidden=true;
}

// ---------- draft ----------
function afterDraft(){saveLocal();renderDraft();renderResult()}
function renderDraft(){
  const box=$('draftRows');box.replaceChildren();
  const mat=result?meta.material:DATA.example.material;
  if(!draft.length)box.append(el('p',{class:'empty',textContent:'點上面任一行加入，或按「整篇用這版」。'}));
  draft.forEach((r,i)=>{
    const input=el('input',{type:'text',value:r.text,id:`draft-${i}`,ariaLabel:`第 ${i+1} 行`,className:hasBracket(r.text)?'br':'',
      oninput:e=>{r.text=e.target.value;e.target.className=hasBracket(r.text)?'br':'';saveLocal();stats()}});
    const move=d=>{const j=i+d;if(j<0||j>=draft.length)return;[draft[i],draft[j]]=[draft[j],draft[i]];afterDraft()};
    box.append(el('div',{class:'drow'},el('span',{class:'tag '+(r.from||''),textContent:r.from||'＋'}),input,
      el('button',{type:'button',class:'icon',textContent:'↑',title:'上移',ariaLabel:'上移',onclick:()=>move(-1)}),
      el('button',{type:'button',class:'icon',textContent:'↓',title:'下移',ariaLabel:'下移',onclick:()=>move(1)}),
      el('button',{type:'button',class:'icon',textContent:'✕',title:'刪除',ariaLabel:'刪除',onclick:()=>{draft.splice(i,1);afterDraft()}})));
  });
  $('draftMat').textContent=mat||'';
  stats();
}
function stats(){
  const lines=draft.map(r=>r.text.trim()).filter(Boolean);
  const chars=lines.join('').replace(/\s/g,'').length;
  const br=lines.filter(hasBracket).length, bn=lines.filter(l=>bannedIn(l).length).length;
  let msg=`${chars} 字、${lines.length} 行（官網中位數約 118 字、9 行）`;
  if(br)msg+=`；還有 ${br} 行有 [方括號]，確認後請拿掉括號`;
  if(bn)msg+=`；${bn} 行有不要再出現的字詞`;
  $('draftStats').textContent=msg;$('draftStats').className='status'+(br||bn?' err':'');
}
function draftText(){const mat=result?meta.material:DATA.example.material;return draft.map(r=>r.text.trim()).filter(Boolean).concat(mat?[mat]:[]).join('\n')}
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(draftText());$('draftMsg').textContent='已複製'}catch(e){$('draftMsg').textContent='無法自動複製，請手動選取每一行'}});
$('blank').addEventListener('click',()=>{draft.push({text:'',from:''});afterDraft();$(`draft-${draft.length-1}`)?.focus()});
$('clear').addEventListener('click',()=>{draft=[];afterDraft()});
$('saveFinal').addEventListener('click',async()=>{
  const lines=draft.map(r=>({text:r.text.trim(),from:r.from||''})).filter(l=>l.text);
  if(!lines.length){$('draftMsg').textContent='先組好文案再存。';return}
  if(lines.some(l=>hasBracket(l.text))){$('draftMsg').textContent='還有 [方括號] 沒確認，確認後再存成定稿。';return}
  if(!result){$('draftMsg').textContent='範例不能存成定稿，請先寫你的商品。';return}
  if(!db){$('draftMsg').textContent='訓練紀錄目前無法連線，定稿沒有存。';return}
  try{await db.collection('finals').add({name:meta.name,category:meta.category,lines,material:meta.material||'',at:Date.now()});$('draftMsg').textContent='已存成定稿，下次寫作會參考。'}
  catch(e){$('draftMsg').textContent=e?.code==='quota_exceeded'?'訓練紀錄已滿，請刪掉一些舊定稿。':'沒有存成功（你可能只有檢視權限）。'}
});

// ---------- training memory ----------
async function toggleLike(text,route){
  if(!db){setStatus('訓練紀錄目前無法連線。',true);return}
  const ref=db.collection('liked').doc('l'+hash(text));
  try{if(liked.some(l=>l.text===text))await ref.delete();else await ref.set({text,route,at:Date.now()})}catch(e){setStatus('沒有存成功（你可能只有檢視權限）。',true)}
}
async function likeAll(lines,route){
  if(!db){setStatus('訓練紀錄目前無法連線。',true);return}
  const have=new Set(liked.map(l=>l.text));
  try{for(const t of lines)if(!have.has(t)&&!hasBracket(t))await db.collection('liked').doc('l'+hash(t)).set({text:t,route,at:Date.now()});setStatus(`已把路線 ${route} 的句子記為喜歡（方括號句除外）。`)}
  catch(e){setStatus('沒有存成功（你可能只有檢視權限）。',true)}
}
async function addBan(phrase){
  phrase=phrase.trim();if(!phrase)return;
  if(!db){setStatus('訓練紀錄目前無法連線。',true);return}
  if(phrase.length>40){setStatus('「不要再出現」請只選幾個字的詞或短句。',true);return}
  try{await db.collection('banned').doc('b'+hash(phrase)).set({phrase,at:Date.now()});setStatus(`之後不會再用「${phrase}」。`)}catch(e){setStatus('沒有存成功（你可能只有檢視權限）。',true)}
}
$('banAdd').addEventListener('click',()=>{addBan($('banInput').value);$('banInput').value=''});
$('banInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('banAdd').click()}});

// selection inside a route line -> "不要再出現" button
const pop=$('banPop');let popText='';
function updatePop(){
  const sel=getSelection();const t=String(sel).trim();
  const node=sel.anchorNode&&(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement);
  if(!t||t.length>40||!node?.closest('.col .txt')){pop.hidden=true;return}
  const rect=sel.getRangeAt(0).getBoundingClientRect();
  popText=t;pop.textContent=`不要再出現「${t}」`;pop.hidden=false;
  pop.style.left=Math.max(8,Math.min(innerWidth-pop.offsetWidth-8,rect.left))+'px';
  pop.style.top=Math.max(8,rect.top-pop.offsetHeight-8)+'px';
}
document.addEventListener('selectionchange',()=>requestAnimationFrame(updatePop));
pop.addEventListener('mousedown',e=>e.preventDefault());
pop.addEventListener('click',()=>{addBan(popText);pop.hidden=true;getSelection().removeAllRanges()});

function renderMemory(){
  $('memory').replaceChildren(
    el('span',{class:'pill'},el('b',{textContent:String(banned.length)}),' 個不要再出現'),
    el('span',{class:'pill'},el('b',{textContent:String(liked.length)}),' 句喜歡'),
    el('span',{class:'pill'},el('b',{textContent:String(finals.length)}),' / 10 篇定稿'));
  const list=(id,items,label,del)=>{const ul=$(id);ul.replaceChildren();if(!items.length){ul.append(el('li',{},el('span',{class:'empty',textContent:label})));return}
    items.forEach(it=>ul.append(el('li',{},el('span',{textContent:it.label}),el('button',{type:'button',class:'icon',textContent:'✕',title:'刪除',ariaLabel:'刪除',onclick:()=>del(it)}))))};
  const rm=(coll,id)=>db?.collection(coll).doc(id).delete().catch(()=>setStatus('沒有刪除成功。',true));
  list('banList',banned.map(b=>({label:b.phrase,id:b.id})),'還沒有。反白結果裡的字詞，或在上面輸入。',it=>rm('banned',it.id));
  list('likeList',liked.map(l=>({label:`${l.route?l.route+'｜':''}${l.text}`,id:l.id})),'還沒有。按結果旁的 ♡。',it=>rm('liked',it.id));
  list('finalList',finals.map(f=>({label:`${f.name}：${f.lines.map(l=>l.text).join(' ／ ')}`,id:f.id})),'還沒有。組好文案後按「存成定稿」。',it=>rm('finals',it.id));
  const count={A:0,B:0,C:0,'':0};finals.forEach(f=>f.lines.forEach(l=>count[l.from in count?l.from:'']++));
  const total=Object.values(count).reduce((a,b)=>a+b,0);
  const colors={A:'var(--a)',B:'var(--b)',C:'var(--c)','':'var(--muted)'};
  $('routeBar').replaceChildren(...Object.entries(count).filter(([,n])=>n).map(([k,n])=>el('i',{style:`width:${n/total*100}%;background:${colors[k]}`})));
  $('routeLegend').replaceChildren(...(total?Object.entries(count).filter(([,n])=>n).map(([k,n])=>el('span',{textContent:`${k?k+' '+ROUTES[k]:'自己寫'} ${Math.round(n/total*100)}%`})):[el('span',{textContent:'定稿裡各路線句子的比例會顯示在這裡'})]));
}

// ---------- boot ----------
const saved=loadLocal();
if(saved){FIELDS.forEach(f=>{if(saved.form?.[f]!=null)$(f).value=saved.form[f]});result=saved.result||null;draft=Array.isArray(saved.draft)?saved.draft:[];
  if(result&&saved.form)meta={name:saved.form.name,category:saved.form.category,colors:saved.form.colors,material:saved.form.material}}
renderThumbs();renderResult();renderDraft();renderMemory();

(async()=>{
  sample=await window.claude?.use('sample')??null;
  if(!sample){setStatus('要在 claude.ai 上登入並開啟這個頁面，才能寫作。',true);$('go').disabled=true}
  else{const lim=await sample.limits().catch(()=>null);maxImages=lim?.images?.maxCount||0;
    if(!lim?.images){setStatus('這個檢視不能傳送照片給 Claude，所以暫時無法寫作。',true);$('go').disabled=true}
    renderThumbs()}
})();
(async()=>{
  db=await window.claude?.use('db')??null;
  if(!db){$('dbStatus').textContent='訓練紀錄需要登入 claude.ai 才能讀寫。';return}
  const timer=setTimeout(()=>{$('dbStatus').textContent='訓練紀錄還連不上，顯示的可能不是最新。'},10000);
  const watch=(coll,assign)=>db.collection(coll).orderBy('at','desc').limit(300).onSnapshot(s=>{
    if(!s.metadata.fromCache){clearTimeout(timer);$('dbStatus').textContent=''}
    assign(s.docs.map(d=>({id:d.id,...d.data()})));renderMemory();renderResult();stats()},
    ()=>{clearTimeout(timer);$('dbStatus').textContent='訓練紀錄連線中斷，請重新整理頁面。'});
  watch('banned',v=>banned=v.filter(b=>typeof b.phrase==='string'));
  watch('liked',v=>liked=v.filter(l=>typeof l.text==='string'));
  watch('finals',v=>finals=v.filter(f=>Array.isArray(f.lines)));
})();
